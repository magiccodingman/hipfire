name: Apply Qwen35 quantizer regression fixes

on:
  push:
    branches:
      - fix/qwen35-quantizer-regressions

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(quantize):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen35-quantizer-regressions

      - name: Apply source patch
        run: python3 scripts/apply-qwen35-quantizer-regression-fix.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Check quantizer
        run: cargo check -p hipfire-quantize

      - name: Remove one-shot patch machinery
        run: |
          git rm .github/workflows/apply-qwen35-quantizer-regression-fix.yml
          git rm scripts/apply-qwen35-quantizer-regression-fix.py

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(quantize): restore Qwen35 tensor handling"
          git push origin HEAD:fix/qwen35-quantizer-regressions
